<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tick — Task Tracker</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tick">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230f172a'/><path d='M28 52 L44 68 L72 36' stroke='%23ffffff' stroke-width='9' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
};
</script>

<style>
  html, body { height: 100dvh; }
  body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 9999px; }
  .dark ::-webkit-scrollbar-thumb { background: #3f3f46; }

  input[type="date"] {
    -webkit-appearance: none; appearance: none;
    min-width: 0; max-width: 100%; width: 100%;
    box-sizing: border-box; display: block;
    line-height: 1.25rem; min-height: 2.5rem;
  }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; }

  /* Subtle motion: pure fades only. No slides, no springs, no scale. */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

  .toast-enter { animation: fadeIn 0.22s ease-out forwards; }
  .toast-exit { animation: fadeOut 0.2s ease-in forwards; }
  .completing { animation: fadeOut 0.3s ease-in forwards; pointer-events: none; }

  .checkbox {
    width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid #a1a1aa; background: transparent;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer; transition: all 0.18s ease;
    color: transparent;
  }
  .dark .checkbox { border-color: #52525b; }
  .checkbox:hover { border-color: #18181b; }
  .dark .checkbox:hover { border-color: #fafafa; }
  .checkbox i { font-size: 10px; }
  .checkbox.done { background: #18181b; border-color: #18181b; color: white; }
  .dark .checkbox.done { background: #fafafa; border-color: #fafafa; color: #09090b; }

  .mobile-bottom-nav {
    padding-bottom: env(safe-area-inset-bottom, 0);
    background: white; border-top: 1px solid #e4e4e7;
    z-index: 50; flex-shrink: 0;
  }
  .dark .mobile-bottom-nav { background: #18181b; border-top-color: #27272a; }

  :focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

  /* Motion preference:
     - default (no class): respects OS prefers-reduced-motion
     - html.motion-on: force reduce (block fades)
     - html.motion-off: force motion (allow fades even if OS says reduce) */
  @media (prefers-reduced-motion: reduce) {
    html:not(.motion-off) *,
    html:not(.motion-off) *::before,
    html:not(.motion-off) *::after {
      scroll-behavior: auto !important;
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
  html.motion-on *,
  html.motion-on *::before,
  html.motion-on *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
</style>
</head>

<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-800 dark:text-zinc-100 h-[100dvh] overflow-hidden flex flex-col transition-colors duration-200">

<div id="app" class="max-w-3xl mx-auto px-4 py-6 md:py-8 w-full flex-1 overflow-y-auto">

  <header class="flex justify-between items-center mb-6">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-zinc-900 dark:text-white flex items-center gap-2">
        <span class="w-9 h-9 md:w-10 md:h-10 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 rounded-xl flex items-center justify-center flex-shrink-0">
          <i class="fa-solid fa-check text-base md:text-lg"></i>
        </span>
        Tick
      </h1>
      <p class="text-xs md:text-sm text-zinc-500 dark:text-zinc-400 mt-0.5">Task Tracker</p>
    </div>
    <button id="themeToggleBtn" title="Toggle Theme" class="p-2.5 rounded-xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
      <i class="fa-solid fa-moon dark:hidden"></i>
      <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
    </button>
  </header>

  <nav class="hidden md:flex gap-2 mb-6 bg-white dark:bg-zinc-900 p-1.5 rounded-xl border border-zinc-200 dark:border-zinc-800 shadow-sm">
    <button onclick="switchTab('today')" class="desktop-tab flex-1 py-2.5 rounded-lg font-semibold text-sm transition-all duration-200 flex items-center justify-center gap-2 tab-active bg-zinc-50 dark:bg-zinc-950" data-tab="today">
      <i class="fa-solid fa-list-check"></i> Today
    </button>
    <button onclick="switchTab('all')" class="desktop-tab flex-1 py-2.5 rounded-lg font-semibold text-sm transition-all duration-200 flex items-center justify-center gap-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white" data-tab="all">
      <i class="fa-solid fa-layer-group"></i> All
    </button>
    <button onclick="switchTab('settings')" class="desktop-tab flex-1 py-2.5 rounded-lg font-semibold text-sm transition-all duration-200 flex items-center justify-center gap-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white" data-tab="settings">
      <i class="fa-solid fa-gear"></i> Settings
    </button>
  </nav>

  <div id="storageWarning" class="hidden mb-6 p-4 rounded-2xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900 text-amber-800 dark:text-amber-200 text-sm flex items-start gap-3">
    <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
    <p>Storage is unavailable. Entries won't be saved.</p>
  </div>

  <!-- TODAY -->
  <section id="today-view" class="tab-view">
    <div class="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 shadow-sm mb-6 p-5">
      <form id="taskForm" onsubmit="return false;">
        <div>
          <label class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-400 mb-1">Task</label>
          <input type="text" id="titleInput" placeholder="What needs to be done?" required autocomplete="off" maxlength="200"
            class="w-full px-3 py-2.5 bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl text-sm font-medium text-zinc-900 dark:text-white placeholder:text-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-900 dark:focus:ring-zinc-100 transition">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mt-3">
          <div>
            <label class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-400 mb-1">Date <span class="normal-case font-normal">(optional)</span></label>
            <input type="date" id="dateInput" class="w-full px-3 py-2.5 bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl text-sm font-medium text-zinc-800 dark:text-zinc-100 focus:outline-none focus:ring-2 focus:ring-zinc-900 dark:focus:ring-zinc-100 transition">
          </div>
          <div class="sm:col-span-2">
            <label class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-400 mb-1">Notes <span class="normal-case font-normal">(optional)</span></label>
            <textarea id="notesInput" rows="1" maxlength="10000" placeholder="Add details…" class="w-full px-3 py-2.5 bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl text-sm font-medium text-zinc-800 dark:text-zinc-100 placeholder:text-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-900 dark:focus:ring-zinc-100 transition resize-none"></textarea>
          </div>
        </div>

        <button type="submit" class="w-full mt-3 py-3 rounded-xl bg-zinc-900 hover:bg-black dark:bg-zinc-100 dark:hover:bg-white text-white dark:text-zinc-900 font-bold text-sm shadow-sm transition-all duration-200 flex items-center justify-center gap-2">
          <i class="fa-solid fa-plus"></i> Add Task
        </button>
      </form>
    </div>

    <div id="overdueSection" class="hidden mb-6">
      <h3 class="text-[10px] uppercase font-bold tracking-wider text-rose-500 mb-2 flex items-center gap-1.5">
        <i class="fa-solid fa-circle-exclamation"></i> Overdue
      </h3>
      <div id="overdueList" class="space-y-2"></div>
    </div>

    <div id="todaySection">
      <div id="todayList" class="space-y-2"></div>
    </div>
  </section>

  <!-- ALL -->
  <section id="all-view" class="tab-view hidden">
    <div class="flex justify-center mb-4">
      <div class="inline-flex bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-xl p-1 text-xs">
        <button onclick="setAllView('scheduled')" data-allview="scheduled" class="allview-btn px-4 py-2 rounded-lg font-semibold transition">Scheduled</button>
        <button onclick="setAllView('done')" data-allview="done" class="allview-btn px-4 py-2 rounded-lg font-semibold transition">Done</button>
      </div>
    </div>

    <div class="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 shadow-sm p-5">
      <div class="mb-4">
        <input type="text" id="searchInput" placeholder="Search tasks…"
          class="text-xs px-3 py-2 bg-zinc-100 dark:bg-zinc-800 border-0 rounded-xl text-zinc-700 dark:text-zinc-200 font-medium focus:outline-none focus:ring-2 focus:ring-zinc-900 dark:focus:ring-zinc-100 w-full">
      </div>

      <div id="allContent" class="space-y-5"></div>
      <div id="allEmpty" class="hidden py-12 text-center">
        <div class="w-12 h-12 mx-auto mb-3 text-zinc-300 dark:text-zinc-600 flex items-center justify-center rounded-full bg-zinc-50 dark:bg-zinc-950">
          <i class="fa-solid fa-clipboard-list text-xl"></i>
        </div>
        <p class="text-sm font-medium text-zinc-500 dark:text-zinc-400" id="allEmptyTitle">No tasks</p>
        <p class="text-xs text-zinc-400 mt-1" id="allEmptySub"></p>
      </div>
    </div>
  </section>

  <!-- SETTINGS -->
  <section id="settings-view" class="tab-view hidden">
    <div class="bg-white dark:bg-zinc-900 rounded-2xl border border-zinc-200 dark:border-zinc-800 shadow-sm p-5">
      <h3 class="text-base font-bold text-zinc-800 dark:text-zinc-100 flex items-center gap-2 mb-6">
        <i class="fa-solid fa-gear text-zinc-400"></i> Settings
      </h3>

      <div class="space-y-6">
        <div>
          <p class="text-[10px] uppercase font-bold tracking-wider text-zinc-400 mb-2">Appearance</p>
          <button id="themeToggleBtnSettings" class="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-100 dark:border-zinc-800 text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition text-sm font-semibold flex items-center justify-center gap-2">
            <i class="fa-solid fa-moon dark:hidden"></i>
            <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
            <span class="dark:hidden">Dark Mode</span>
            <span class="hidden dark:inline">Light Mode</span>
          </button>
        </div>

        <div>
          <p class="text-[10px] uppercase font-bold tracking-wider text-zinc-400 mb-2">Reduce Animations</p>
          <div class="inline-flex w-full bg-zinc-50 dark:bg-zinc-950 border border-zinc-100 dark:border-zinc-800 rounded-xl p-1 text-xs">
            <button onclick="setMotionPref('auto')" data-motion="auto" class="motion-btn flex-1 px-2 py-2 rounded-lg font-semibold transition">Follow System</button>
            <button onclick="setMotionPref('on')" data-motion="on" class="motion-btn flex-1 px-2 py-2 rounded-lg font-semibold transition">On</button>
            <button onclick="setMotionPref('off')" data-motion="off" class="motion-btn flex-1 px-2 py-2 rounded-lg font-semibold transition">Off</button>
          </div>
          <p class="text-[10px] text-zinc-400 mt-1.5">"On" blocks animations. "Off" forces them on, even if iOS Reduce Motion is enabled.</p>
        </div>

        <div>
          <p class="text-[10px] uppercase font-bold tracking-wider text-zinc-400 mb-2">Export</p>
          <button id="exportBtn" class="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-100 dark:border-zinc-800 text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition text-sm font-semibold flex items-center justify-center gap-2">
            <i class="fa-solid fa-download"></i> Download JSON Backup
          </button>
        </div>

        <div>
          <p class="text-[10px] uppercase font-bold tracking-wider text-zinc-400 mb-2">Import</p>
          <label for="importFileInput" class="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-100 dark:border-zinc-800 text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition text-sm font-semibold flex items-center justify-center gap-2 cursor-pointer">
            <i class="fa-solid fa-upload"></i> Restore from Backup
            <input type="file" id="importFileInput" accept=".json" class="hidden">
          </label>
        </div>

        <div>
          <p class="text-[10px] uppercase font-bold tracking-wider text-rose-500 mb-2">Reset</p>
          <button id="resetBtn" class="w-full px-4 py-3 rounded-xl border border-rose-200 dark:border-rose-900 text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 font-semibold text-sm transition flex items-center justify-center gap-2">
            <i class="fa-solid fa-trash-can"></i> Clear All Data
          </button>
        </div>
      </div>
    </div>
  </section>

</div>

<nav class="mobile-bottom-nav md:hidden flex justify-around py-2">
  <button onclick="switchTab('today')" class="mobile-tab flex flex-col items-center gap-1 p-2 text-zinc-900 dark:text-white" data-tab="today">
    <i class="fa-solid fa-list-check text-lg"></i>
    <span class="text-[10px] font-medium">Today</span>
  </button>
  <button onclick="switchTab('all')" class="mobile-tab flex flex-col items-center gap-1 p-2 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200" data-tab="all">
    <i class="fa-solid fa-layer-group text-lg"></i>
    <span class="text-[10px] font-medium">All</span>
  </button>
  <button onclick="switchTab('settings')" class="mobile-tab flex flex-col items-center gap-1 p-2 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200" data-tab="settings">
    <i class="fa-solid fa-gear text-lg"></i>
    <span class="text-[10px] font-medium">Settings</span>
  </button>
</nav>

<div id="toastContainer" role="status" aria-live="polite" aria-atomic="true" class="fixed bottom-24 md:bottom-10 left-1/2 -translate-x-1/2 z-[100] flex flex-col items-center gap-2 pointer-events-none w-full px-4"></div>

<!-- Edit Modal -->
<div id="editModal" class="hidden fixed inset-0 bg-zinc-950/50 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
  <div role="dialog" aria-modal="true" class="bg-white dark:bg-zinc-900 rounded-2xl max-w-md w-full p-6 shadow-xl border border-zinc-100 dark:border-zinc-800 max-h-[85vh] overflow-y-auto">
    <div class="flex items-start justify-between mb-4">
      <h3 class="text-lg font-bold text-zinc-900 dark:text-white">Edit Task</h3>
      <button id="closeEditBtn" class="p-1.5 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 transition">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>

    <form id="editForm" onsubmit="return false;">
      <div class="mb-3">
        <label class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-400 mb-1">Task</label>
        <input type="text" id="editTitleInput" required maxlength="200" class="w-full px-3 py-2.5 bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl text-sm font-medium text-zinc-800 dark:text-zinc-100 focus:outline-none focus:ring-2 focus:ring-zinc-900 dark:focus:ring-zinc-100 transition">
      </div>
      <div class="mb-3">
        <label class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-400 mb-1">Date <span class="normal-case font-normal">(optional)</span></label>
        <input type="date" id="editDateInput" class="w-full px-3 py-2.5 bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl text-sm font-medium text-zinc-800 dark:text-zinc-100 focus:outline-none focus:ring-2 focus:ring-zinc-900 dark:focus:ring-zinc-100 transition">
      </div>
      <div class="mb-4">
        <label class="block text-[10px] font-semibold uppercase tracking-wider text-zinc-400 mb-1">Notes <span class="normal-case font-normal">(optional)</span></label>
        <textarea id="editNotesInput" rows="3" maxlength="10000" class="w-full px-3 py-2.5 bg-zinc-50 dark:bg-zinc-950 border border-zinc-200 dark:border-zinc-800 rounded-xl text-sm font-medium text-zinc-800 dark:text-zinc-100 focus:outline-none focus:ring-2 focus:ring-zinc-900 dark:focus:ring-zinc-100 transition resize-none"></textarea>
      </div>

      <div class="flex gap-2">
        <button type="button" id="editDeleteBtn" title="Delete task" class="px-3 py-2.5 rounded-xl border border-rose-200 dark:border-rose-900 text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 font-bold text-sm transition">
          <i class="fa-solid fa-trash-can"></i>
        </button>
        <button type="button" id="editCancelBtn" class="flex-1 py-2.5 rounded-xl bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-zinc-700 dark:text-zinc-200 font-bold text-sm transition">
          Cancel
        </button>
        <button type="submit" class="flex-1 py-2.5 rounded-xl bg-zinc-900 hover:bg-black dark:bg-zinc-100 dark:hover:bg-white text-white dark:text-zinc-900 font-bold text-sm transition">
          Save
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Confirm Modal -->
<div id="confirmModal" class="hidden fixed inset-0 bg-zinc-950/50 backdrop-blur-sm z-[75] flex items-center justify-center p-4">
  <div role="dialog" aria-modal="true" class="bg-white dark:bg-zinc-900 rounded-2xl max-w-sm w-full p-6 shadow-xl border border-zinc-100 dark:border-zinc-800">
    <h3 id="confirmTitle" class="text-lg font-bold text-zinc-900 dark:text-white mb-2">Confirm</h3>
    <p id="confirmMessage" class="text-sm text-zinc-500 dark:text-zinc-400 mb-6"></p>
    <div class="flex gap-3 justify-end">
      <button id="confirmCancelBtn" class="px-4 py-2 text-sm font-semibold text-zinc-600 dark:text-zinc-300 bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 rounded-xl transition">Cancel</button>
      <button id="confirmOkBtn" class="px-4 py-2 text-sm font-semibold text-white bg-rose-500 hover:bg-rose-600 rounded-xl transition">Confirm</button>
    </div>
  </div>
</div>

<!-- Import Confirm -->
<div id="importConfirmModal" class="hidden fixed inset-0 bg-zinc-950/50 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
  <div role="dialog" aria-modal="true" class="bg-white dark:bg-zinc-900 rounded-2xl max-w-sm w-full p-6 shadow-xl border border-zinc-100 dark:border-zinc-800">
    <h3 class="text-lg font-bold text-zinc-900 dark:text-white mb-2">Replace All Data?</h3>
    <p id="importConfirmText" class="text-sm text-zinc-500 dark:text-zinc-400 mb-6"></p>
    <div class="flex gap-3 justify-end">
      <button id="cancelImportBtn" class="px-4 py-2 text-sm font-semibold text-zinc-600 dark:text-zinc-300 bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 rounded-xl transition">Cancel</button>
      <button id="confirmImportBtn" class="px-4 py-2 text-sm font-semibold text-white bg-zinc-900 dark:bg-zinc-100 dark:text-zinc-900 hover:bg-black dark:hover:bg-white rounded-xl transition">Replace</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'todo_tasks_v2';
  const THEME_KEY = 'todo_theme_v2';
  const MOTION_KEY = 'todo_motion_v2';
  const MAX_VISIBLE_TOASTS = 3;

  let tasks = [];
  let currentTab = 'today';
  let allView = 'scheduled';
  let editingId = null;
  let pendingConfirmAction = null;
  let pendingImportData = null;
  let motionPref = 'auto';

  function storageGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function storageSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function testStorage() { try { const p = '__probe__'; localStorage.setItem(p, '1'); localStorage.removeItem(p); return true; } catch (e) { return false; } }

  function pad(n) { return String(n).padStart(2, '0'); }
  function formatDate(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function parseDate(str) { const [y, m, d] = str.split('-').map(Number); return new Date(y, m-1, d); }
  function todayStr() { return formatDate(new Date()); }

  function formatDateLabel(dateStr) {
    if (!dateStr) return '';
    const today = todayStr();
    if (dateStr === today) return 'Today';
    const t = new Date(); t.setDate(t.getDate() + 1);
    if (dateStr === formatDate(t)) return 'Tomorrow';
    const y = new Date(); y.setDate(y.getDate() - 1);
    if (dateStr === formatDate(y)) return 'Yesterday';
    const d = parseDate(dateStr);
    const now = new Date();
    if (d.getFullYear() === now.getFullYear()) {
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function daysBetween(a, b) { return Math.round((parseDate(b) - parseDate(a)) / 86400000); }

  function isValidDateString(value) {
    if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
    const d = parseDate(value);
    return Number.isFinite(d.getTime()) && formatDate(d) === value;
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function showToast(message, type = 'success') {
    while (toastContainer.children.length >= MAX_VISIBLE_TOASTS) {
      toastContainer.removeChild(toastContainer.firstChild);
    }
    const toast = document.createElement('div');
    const isSuccess = type === 'success';
    toast.className = `${isSuccess ? 'bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900' : 'bg-rose-500 text-white'} px-5 py-3 rounded-xl shadow-lg font-semibold text-sm toast-enter flex items-center gap-2 pointer-events-auto`;
    const icon = isSuccess ? 'fa-circle-check' : 'fa-circle-exclamation';
    toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${escapeHtml(message)}</span>`;
    toastContainer.appendChild(toast);
    setTimeout(() => {
      toast.classList.remove('toast-enter');
      toast.classList.add('toast-exit');
      setTimeout(() => toast.remove(), 300);
    }, 2500);
  }

  const appEl = document.getElementById('app');
  const toastContainer = document.getElementById('toastContainer');
  const storageWarning = document.getElementById('storageWarning');

  const taskForm = document.getElementById('taskForm');
  const titleInput = document.getElementById('titleInput');
  const dateInput = document.getElementById('dateInput');
  const notesInput = document.getElementById('notesInput');

  const overdueSection = document.getElementById('overdueSection');
  const overdueList = document.getElementById('overdueList');
  const todayList = document.getElementById('todayList');

  const searchInput = document.getElementById('searchInput');
  const allContent = document.getElementById('allContent');
  const allEmpty = document.getElementById('allEmpty');
  const allEmptyTitle = document.getElementById('allEmptyTitle');
  const allEmptySub = document.getElementById('allEmptySub');

  const editModal = document.getElementById('editModal');
  const editTitleInput = document.getElementById('editTitleInput');
  const editDateInput = document.getElementById('editDateInput');
  const editNotesInput = document.getElementById('editNotesInput');
  const closeEditBtn = document.getElementById('closeEditBtn');
  const editCancelBtn = document.getElementById('editCancelBtn');
  const editDeleteBtn = document.getElementById('editDeleteBtn');
  const editForm = document.getElementById('editForm');

  const confirmModal = document.getElementById('confirmModal');
  const confirmTitle = document.getElementById('confirmTitle');
  const confirmMessage = document.getElementById('confirmMessage');
  const confirmCancelBtn = document.getElementById('confirmCancelBtn');
  const confirmOkBtn = document.getElementById('confirmOkBtn');

  const importConfirmModal = document.getElementById('importConfirmModal');
  const importConfirmText = document.getElementById('importConfirmText');
  const cancelImportBtn = document.getElementById('cancelImportBtn');
  const confirmImportBtn = document.getElementById('confirmImportBtn');
  const importFileInput = document.getElementById('importFileInput');

  function loadData() {
    const raw = storageGet(STORAGE_KEY);
    if (!raw) { tasks = []; return; }
    try {
      const parsed = JSON.parse(raw);
      tasks = Array.isArray(parsed) ? sanitizeTasks(parsed) : [];
    } catch (e) { tasks = []; }
  }

  function sanitizeTasks(input) {
    if (!Array.isArray(input)) return [];
    const usedIds = new Set();
    let nextId = Date.now();
    const safeTs = v => {
      const p = typeof v === 'number' ? v : Date.parse(v);
      return Number.isFinite(p) && p > 0 ? p : null;
    };
    return input.slice(0, 10000).filter(item => item && typeof item === 'object' && !Array.isArray(item)).map(item => {
      let id = Number.isSafeInteger(item.id) && item.id > 0 ? item.id : null;
      if (id === null || usedIds.has(id)) {
        while (usedIds.has(nextId)) nextId++;
        id = nextId++;
      }
      usedIds.add(id);
      const completedAtMs = safeTs(item.completedAt);
      return {
        id,
        title: String(item.title == null ? '' : item.title).trim().slice(0, 200),
        notes: String(item.notes == null ? '' : item.notes).slice(0, 10000),
        dueDate: isValidDateString(item.dueDate) ? item.dueDate : null,
        completed: item.completed === true && !!completedAtMs,
        completedAt: completedAtMs ? new Date(completedAtMs).toISOString() : null,
        createdAt: safeTs(item.createdAt) || Date.now()
      };
    }).filter(t => t.title.length > 0);
  }

  function saveData() { storageSet(STORAGE_KEY, JSON.stringify(tasks)); }

  function createTaskId() {
    let id = Date.now();
    while (tasks.some(t => t.id === id)) id++;
    return id;
  }

  function sortByDateAsc(a, b) {
    if (!a.dueDate && !b.dueDate) return a.createdAt - b.createdAt;
    if (!a.dueDate) return 1;
    if (!b.dueDate) return -1;
    if (a.dueDate !== b.dueDate) return a.dueDate < b.dueDate ? -1 : 1;
    return a.createdAt - b.createdAt;
  }

  function sortByCompletedDesc(a, b) {
    return new Date(b.completedAt || 0) - new Date(a.completedAt || 0);
  }

  function refreshCurrentView() {
    if (currentTab === 'today') renderToday();
    if (currentTab === 'all') renderAll();
  }

  function loadMotionPref() {
    const v = storageGet(MOTION_KEY);
    if (v === 'auto' || v === 'on' || v === 'off') motionPref = v;
  }

  function applyMotionPref() {
    const html = document.documentElement;
    html.classList.remove('motion-on', 'motion-off');
    if (motionPref === 'on') html.classList.add('motion-on');
    else if (motionPref === 'off') html.classList.add('motion-off');
    updateMotionButtons();
  }

  function updateMotionButtons() {
    document.querySelectorAll('.motion-btn').forEach(b => {
      const on = b.dataset.motion === motionPref;
      b.className = `motion-btn flex-1 px-2 py-2 rounded-lg font-semibold transition ${on ? 'bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow-sm' : 'text-zinc-500 hover:text-zinc-900 dark:hover:text-white'}`;
    });
  }

  window.setMotionPref = function(pref) {
    if (!['auto', 'on', 'off'].includes(pref)) return;
    motionPref = pref;
    storageSet(MOTION_KEY, pref);
    applyMotionPref();
    const msg = pref === 'auto' ? 'Following system motion' : pref === 'on' ? 'Animations reduced' : 'Animations enabled';
    showToast(msg);
  };

  window.switchTab = function(tabId) {
    if (!['today', 'all', 'settings'].includes(tabId)) return;
    currentTab = tabId;
    document.querySelectorAll('.tab-view').forEach(v => v.classList.add('hidden'));
    document.getElementById(tabId + '-view').classList.remove('hidden');

    document.querySelectorAll('.desktop-tab').forEach(btn => {
      if (btn.dataset.tab === tabId) {
        btn.className = "desktop-tab flex-1 py-2.5 rounded-lg font-semibold text-sm transition-all duration-200 flex items-center justify-center gap-2 tab-active bg-zinc-50 dark:bg-zinc-950";
      } else {
        btn.className = "desktop-tab flex-1 py-2.5 rounded-lg font-semibold text-sm transition-all duration-200 flex items-center justify-center gap-2 text-zinc-500 hover:text-zinc-900 dark:hover:text-white";
      }
    });
    document.querySelectorAll('.mobile-tab').forEach(btn => {
      if (btn.dataset.tab === tabId) {
        btn.className = "mobile-tab flex flex-col items-center gap-1 p-2 text-zinc-900 dark:text-white";
      } else {
        btn.className = "mobile-tab flex flex-col items-center gap-1 p-2 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200";
      }
    });

    if (tabId === 'today') renderToday();
    if (tabId === 'all') renderAll();
    appEl.scrollTo({ top: 0, behavior: 'smooth' });
  };

  function renderTaskRow(t, opts = {}) {
    const { showOverdue = false } = opts;
    const today = todayStr();
    const isOverdue = !t.completed && t.dueDate && t.dueDate < today;

    let rightSide = '';
    if (t.dueDate) {
      if (isOverdue && showOverdue) {
        const days = daysBetween(t.dueDate, today);
        rightSide = `<span class="text-xs text-rose-500 font-semibold flex-shrink-0">${days}d overdue</span>`;
      } else {
        rightSide = `<span class="text-xs text-zinc-400 dark:text-zinc-500 flex-shrink-0">${formatDateLabel(t.dueDate)}</span>`;
      }
    }

    const notePreview = t.notes ? t.notes.split('\n')[0] : '';
    const leftBorder = isOverdue ? 'border-l-2 border-l-rose-500' : 'border-l-2 border-l-transparent';

    return `
      <div class="task-row flex items-center gap-3 p-3 bg-white dark:bg-zinc-900 rounded-xl border border-zinc-200 dark:border-zinc-800 ${leftBorder} hover:border-zinc-300 dark:hover:border-zinc-700 transition cursor-pointer" data-task-id="${t.id}" onclick="openEdit(${t.id})">
        <button class="checkbox" type="button" aria-label="Complete task" onclick="event.stopPropagation(); toggleComplete(${t.id})">
          <i class="fa-solid fa-check"></i>
        </button>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-zinc-900 dark:text-white break-words">${escapeHtml(t.title)}</p>
          ${notePreview ? `<p class="text-[11px] text-zinc-400 dark:text-zinc-500 mt-0.5 italic truncate">${escapeHtml(notePreview)}</p>` : ''}
        </div>
        ${rightSide}
      </div>
    `;
  }

  function renderDoneRow(t) {
    const completedLabel = new Date(t.completedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const notePreview = t.notes ? t.notes.split('\n')[0] : '';
    return `
      <div class="task-row flex items-center gap-3 p-3 bg-white dark:bg-zinc-900 rounded-xl border border-zinc-200 dark:border-zinc-800 hover:border-zinc-300 dark:hover:border-zinc-700 transition cursor-pointer" data-task-id="${t.id}" onclick="openEdit(${t.id})">
        <button class="checkbox done" type="button" aria-label="Mark active" onclick="event.stopPropagation(); toggleComplete(${t.id})">
          <i class="fa-solid fa-check"></i>
        </button>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-zinc-900 dark:text-white line-through opacity-60 break-words">${escapeHtml(t.title)}</p>
          ${notePreview ? `<p class="text-[11px] text-zinc-400 dark:text-zinc-500 mt-0.5 italic truncate">${escapeHtml(notePreview)}</p>` : ''}
        </div>
        <span class="text-xs text-zinc-400 dark:text-zinc-500 flex-shrink-0">${completedLabel}</span>
      </div>
    `;
  }

  function renderToday() {
    const today = todayStr();
    const active = tasks.filter(t => !t.completed);
    const overdue = active.filter(t => t.dueDate && t.dueDate < today).sort(sortByDateAsc);
    const dueToday = active.filter(t => t.dueDate === today).sort(sortByDateAsc);

    if (overdue.length > 0) {
      overdueSection.classList.remove('hidden');
      overdueList.innerHTML = overdue.map(t => renderTaskRow(t, { showOverdue: true })).join('');
    } else {
      overdueSection.classList.add('hidden');
      overdueList.innerHTML = '';
    }

    if (dueToday.length > 0) {
      todayList.innerHTML = dueToday.map(t => renderTaskRow(t)).join('');
    } else {
      todayList.innerHTML = `
        <div class="py-10 text-center">
          <div class="w-12 h-12 mx-auto mb-3 text-zinc-300 dark:text-zinc-700 flex items-center justify-center rounded-full bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800">
            <i class="fa-solid fa-mug-hot text-lg"></i>
          </div>
          <p class="text-sm font-medium text-zinc-500 dark:text-zinc-400">Nothing due today.</p>
          <p class="text-xs text-zinc-400 mt-1">Enjoy the quiet.</p>
        </div>
      `;
    }
  }

  window.setAllView = function(view) {
    if (!['scheduled', 'done'].includes(view)) return;
    allView = view;
    document.querySelectorAll('.allview-btn').forEach(b => {
      if (b.dataset.allview === view) {
        b.className = "allview-btn px-4 py-2 rounded-lg font-semibold transition bg-white dark:bg-zinc-800 text-zinc-900 dark:text-white shadow-sm";
      } else {
        b.className = "allview-btn px-4 py-2 rounded-lg font-semibold transition text-zinc-500 hover:text-zinc-900 dark:hover:text-white";
      }
    });
    renderAll();
  };

  function renderAll() {
    if (allView === 'scheduled') renderScheduled();
    else renderDone();
  }

  function getSearchQuery() { return (searchInput.value || '').trim().toLowerCase(); }

  function matchesSearch(t, query) {
    if (!query) return true;
    return t.title.toLowerCase().includes(query) ||
           (t.notes && t.notes.toLowerCase().includes(query));
  }

  function renderScheduled() {
    const today = todayStr();
    const query = getSearchQuery();

    const scheduled = tasks.filter(t => !t.completed && (!t.dueDate || t.dueDate > today))
      .filter(t => matchesSearch(t, query))
      .sort(sortByDateAsc);

    if (scheduled.length === 0) {
      allContent.innerHTML = '';
      allEmpty.classList.remove('hidden');
      if (query) {
        allEmptyTitle.textContent = 'No matches';
        allEmptySub.textContent = 'Try a different search.';
      } else {
        allEmptyTitle.textContent = 'Nothing scheduled';
        allEmptySub.textContent = 'Tasks with future dates or no date appear here.';
      }
      return;
    }

    allEmpty.classList.add('hidden');

    const dated = scheduled.filter(t => t.dueDate);
    const undated = scheduled.filter(t => !t.dueDate);

    let html = '';
    if (dated.length > 0) {
      html += `<div class="space-y-2">${dated.map(t => renderTaskRow(t)).join('')}</div>`;
    }
    if (undated.length > 0) {
      html += `
        <div>
          <h4 class="text-[10px] uppercase font-bold tracking-wider text-zinc-400 mb-2">No Date</h4>
          <div class="space-y-2">${undated.map(t => renderTaskRow(t)).join('')}</div>
        </div>
      `;
    }

    allContent.innerHTML = html;
  }

  function renderDone() {
    const query = getSearchQuery();
    const done = tasks.filter(t => t.completed)
      .filter(t => matchesSearch(t, query))
      .sort(sortByCompletedDesc);

    if (done.length === 0) {
      allContent.innerHTML = '';
      allEmpty.classList.remove('hidden');
      if (query) {
        allEmptyTitle.textContent = 'No matches';
        allEmptySub.textContent = 'Try a different search.';
      } else {
        allEmptyTitle.textContent = 'Nothing completed yet';
        allEmptySub.textContent = 'Completed tasks appear here.';
      }
      return;
    }

    allEmpty.classList.add('hidden');

    const groups = {};
    done.forEach(t => {
      const dt = new Date(t.completedAt);
      const key = `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}`;
      if (!groups[key]) groups[key] = [];
      groups[key].push(t);
    });

    const sortedKeys = Object.keys(groups).sort().reverse();
    let html = '';
    sortedKeys.forEach(k => {
      const [y, m] = k.split('-').map(Number);
      const label = new Date(y, m - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      html += `
        <div>
          <h4 class="text-[10px] uppercase font-bold tracking-wider text-zinc-400 mb-2">${label}</h4>
          <div class="space-y-2">${groups[k].map(t => renderDoneRow(t)).join('')}</div>
        </div>
      `;
    });

    allContent.innerHTML = html;
  }

  taskForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const title = titleInput.value.trim().slice(0, 200);
    if (!title) { titleInput.focus(); return; }

    const newTask = {
      id: createTaskId(),
      title,
      notes: notesInput.value.trim().slice(0, 10000),
      dueDate: isValidDateString(dateInput.value) ? dateInput.value : null,
      completed: false,
      completedAt: null,
      createdAt: Date.now()
    };

    tasks.unshift(newTask);
    saveData();

    titleInput.value = '';
    dateInput.value = '';
    notesInput.value = '';
    titleInput.focus();

    showToast('Task added');
    refreshCurrentView();
  });

  window.toggleComplete = function(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;

    const wasCompleted = t.completed;
    t.completed = !wasCompleted;
    t.completedAt = wasCompleted ? null : new Date().toISOString();
    saveData();

    if (wasCompleted) showToast('Task moved to active');

    const rows = document.querySelectorAll(`.task-row[data-task-id="${id}"]`);
    rows.forEach(row => {
      const cb = row.querySelector('.checkbox');
      if (cb) cb.classList.toggle('done', t.completed);
      row.classList.add('completing');
    });

    setTimeout(() => refreshCurrentView(), 400);
  };

  window.openEdit = function(id) {
    const t = tasks.find(x => x.id === id);
    if (!t) return;
    editingId = id;
    editTitleInput.value = t.title;
    editDateInput.value = t.dueDate || '';
    editNotesInput.value = t.notes || '';
    editModal.classList.remove('hidden');
    setTimeout(() => editTitleInput.focus(), 100);
  };

  function closeEdit() {
    editingId = null;
    editModal.classList.add('hidden');
  }

  closeEditBtn.addEventListener('click', closeEdit);
  editCancelBtn.addEventListener('click', closeEdit);
  editModal.addEventListener('click', (e) => { if (e.target === editModal) closeEdit(); });

  editForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (editingId === null) return;
    const t = tasks.find(x => x.id === editingId);
    if (!t) return;

    const title = editTitleInput.value.trim().slice(0, 200);
    if (!title) { editTitleInput.focus(); return; }

    t.title = title;
    t.notes = editNotesInput.value.trim().slice(0, 10000);
    t.dueDate = isValidDateString(editDateInput.value) ? editDateInput.value : null;

    saveData();
    closeEdit();
    showToast('Task updated');
    refreshCurrentView();
  });

  editDeleteBtn.addEventListener('click', () => {
    if (editingId === null) return;
    const id = editingId;
    closeEdit();
    openConfirm('Delete this task?', 'This action cannot be undone.', 'Delete', () => {
      tasks = tasks.filter(t => t.id !== id);
      saveData();
      showToast('Task deleted', 'error');
      refreshCurrentView();
    });
  });

  function openConfirm(title, message, buttonText, action) {
    confirmTitle.textContent = title;
    confirmMessage.textContent = message;
    confirmOkBtn.textContent = buttonText;
    pendingConfirmAction = action;
    confirmModal.classList.remove('hidden');
  }

  confirmCancelBtn.addEventListener('click', () => {
    pendingConfirmAction = null;
    confirmModal.classList.add('hidden');
  });

  confirmOkBtn.addEventListener('click', () => {
    if (pendingConfirmAction) pendingConfirmAction();
    pendingConfirmAction = null;
    confirmModal.classList.add('hidden');
  });

  confirmModal.addEventListener('click', (e) => {
    if (e.target === confirmModal) {
      pendingConfirmAction = null;
      confirmModal.classList.add('hidden');
    }
  });

  searchInput.addEventListener('input', renderAll);

  function toggleTheme() {
    document.documentElement.classList.toggle('dark');
    const isDark = document.documentElement.classList.contains('dark');
    storageSet(THEME_KEY, isDark ? 'dark' : 'light');
  }
  document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
  document.getElementById('themeToggleBtnSettings').addEventListener('click', toggleTheme);

  document.getElementById('exportBtn').addEventListener('click', () => {
    const payload = { tasks, exportedAt: new Date().toISOString() };
    const dataStr = JSON.stringify(payload, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `tick_backup_${todayStr()}.json`;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
    showToast('Backup exported');
  });

  importFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) {
      showToast('File too large (5 MB max)', 'error');
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        let importedTasks = [];
        if (Array.isArray(parsed)) importedTasks = parsed;
        else if (parsed && Array.isArray(parsed.tasks)) importedTasks = parsed.tasks;
        else throw new Error('Invalid format');
        if (importedTasks.length > 10000) throw new Error('Too many tasks');

        pendingImportData = sanitizeTasks(importedTasks);
        const incoming = pendingImportData.length;
        const current = tasks.length;
        importConfirmText.textContent = `You currently have ${current} task${current === 1 ? '' : 's'}. This backup contains ${incoming} valid task${incoming === 1 ? '' : 's'}. All current data will be replaced.`;
        importConfirmModal.classList.remove('hidden');
      } catch (err) {
        showToast('Invalid backup file', 'error');
      }
    };
    reader.onerror = () => showToast('Could not read file', 'error');
    reader.readAsText(file);
    e.target.value = '';
  });

  cancelImportBtn.addEventListener('click', () => {
    pendingImportData = null;
    importConfirmModal.classList.add('hidden');
  });

  confirmImportBtn.addEventListener('click', () => {
    if (!pendingImportData) return;
    tasks = pendingImportData;
    pendingImportData = null;
    saveData();
    importConfirmModal.classList.add('hidden');
    showToast('Backup restored');
    refreshCurrentView();
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    openConfirm('Clear all data?', 'This will permanently delete all tasks. Export a backup first if you want to keep them.', 'Clear All', () => {
      tasks = [];
      saveData();
      showToast('All data cleared', 'error');
      refreshCurrentView();
    });
  });

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!editModal.classList.contains('hidden')) { closeEdit(); return; }
    if (!confirmModal.classList.contains('hidden')) {
      pendingConfirmAction = null;
      confirmModal.classList.add('hidden');
      return;
    }
    if (!importConfirmModal.classList.contains('hidden')) {
      pendingImportData = null;
      importConfirmModal.classList.add('hidden');
      return;
    }
  });

  window.addEventListener('load', () => {
    if (!testStorage()) storageWarning.classList.remove('hidden');

    const savedTheme = storageGet(THEME_KEY);
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }

    loadMotionPref();
    applyMotionPref();

    loadData();
    setAllView('scheduled');
    renderToday();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(() => console.log('SW registered'))
        .catch(err => console.log('SW registration failed', err));
    }
  });
</script>
</body>
</html>
